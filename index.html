:root {
  color-scheme: dark;
  --bg: #050506;
  --panel: #0d0d10;
  --panel-2: #121216;
  --glass: rgba(13, 13, 16, 0.72);
  --line: #1f1f25;
  --line-2: #33333b;
  --hair: rgba(255, 255, 255, 0.09);
  --hair-2: rgba(255, 255, 255, 0.18);
  --ink: #f1f1f3;
  --mute: #8c8c95;
  --dim: #55555e;
  --inv-bg: #f1f1f3;
  --inv-ink: #050506;
  --danger: #ff5b52;
  --glow: 0 0 22px rgba(255, 255, 255, 0.07);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --display: 'Fira Sans Extra Condensed', 'Golos Text Variable', system-ui, sans-serif;
  --mono: 'JetBrains Mono Variable', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --rad: 2px;
}

* ,
*::before,
*::after {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--display);
  font-size: 17px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
/* тонкая сетка-«скан» на фоне */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 44px 44px;
  opacity: 0.12;
  z-index: 0;
}
#app {
  position: relative;
  z-index: 1;
  min-height: 100%;
}
button,
input,
textarea {
  font: inherit;
  color: inherit;
}
/* свои скроллбары вместо системных */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--line-2) transparent;
}
::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--line-2);
  border: 2px solid var(--bg);
}
::-webkit-scrollbar-thumb:hover {
  background: var(--mute);
}
[hidden] {
  display: none !important;
}
:focus-visible {
  outline: 1px solid var(--ink);
  outline-offset: 2px;
}
.mono {
  font-family: var(--mono);
}

/* ---------- кнопки / поля ---------- */

.btn {
  height: 42px;
  padding: 0 18px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: transparent;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color 0.12s, background 0.12s, color 0.12s;
}
.btn:hover {
  border-color: var(--ink);
}
.btn:disabled {
  opacity: 0.45;
  cursor: default;
}
.btn-primary {
  background: var(--inv-bg);
  border-color: var(--inv-bg);
  color: var(--inv-ink);
}
.btn-primary:hover {
  background: #fff;
  border-color: #fff;
}
.btn-danger {
  border-color: var(--danger);
  color: var(--danger);
}
.btn-danger:hover {
  background: var(--danger);
  color: #080809;
}
.btn-big {
  height: 54px;
  padding: 0 32px;
  font-size: 14px;
}
.btn-line {
  height: 32px;
  padding: 0 12px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: transparent;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
}
.btn-line:hover {
  border-color: var(--ink);
}
.btn-line-danger {
  border-color: var(--danger);
  color: var(--danger);
}
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 38px;
  height: 38px;
  flex: none;
  border: 1px solid transparent;
  border-radius: var(--rad);
  background: transparent;
  color: var(--mute);
  cursor: pointer;
  transition: color 0.12s, border-color 0.12s;
}
.icon-btn:hover {
  color: var(--ink);
  border-color: var(--line-2);
}
.link {
  padding: 0;
  border: 0;
  background: none;
  color: var(--mute);
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.04em;
  text-decoration: none;
  border-bottom: 1px solid var(--line-2);
  cursor: pointer;
}
.link:hover {
  color: var(--ink);
  border-color: var(--ink);
}
.field {
  width: 100%;
  height: 46px;
  padding: 0 14px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: var(--panel);
  font-family: var(--mono);
  font-size: 14px;
}
.field:focus {
  outline: none;
  border-color: var(--ink);
}
.label {
  display: grid;
  gap: 7px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--mute);
}
.form-error {
  min-height: 22px;
  margin: 0;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--danger);
}

/* ---------- загрузчик-скан ---------- */

.scanner {
  display: inline-block;
  width: 56px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--ink), transparent);
  background-size: 50% 100%;
  background-repeat: no-repeat;
  animation: scan 1.1s linear infinite;
}
.scanner-lg {
  width: 120px;
  height: 3px;
}
@keyframes scan {
  0% {
    background-position: -60% 0;
  }
  100% {
    background-position: 160% 0;
  }
}

/* ---------- обложка ---------- */

.cover {
  display: grid;
  place-items: center;
  min-height: 100vh;
  padding: 24px 16px;
}
.cover-wrap {
  width: min(560px, 100%);
  text-align: center;
}
.cover-top {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--mute);
  font-family: var(--mono);
  letter-spacing: 0.4em;
  font-size: 12px;
}
.cover-mark {
  animation: blink 1.4s steps(1) infinite;
}
@keyframes blink {
  50% {
    opacity: 0.25;
  }
}
.cover-clock {
  margin: 20px 0 14px;
  font-family: var(--mono);
  font-size: clamp(52px, 15vw, 108px);
  font-weight: 300;
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
}
.cover-tag {
  max-width: 34em;
  margin: 0 auto 32px;
  color: var(--mute);
  font-size: 18px;
}
.cover-cmd {
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 360px;
  margin: 0 auto;
  padding: 0 14px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: var(--panel);
}
.cover-prompt {
  font-family: var(--mono);
  color: var(--dim);
}
.cover-field {
  flex: 1;
  height: 46px;
  border: 0;
  background: none;
  font-family: var(--mono);
  font-size: 14px;
}
.cover-field:focus {
  outline: none;
}
.cover-foot {
  margin-top: 20px;
  color: var(--dim);
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.1em;
}

/* ---------- экран входа / настройки ---------- */

.gate {
  min-height: 100vh;
}
.gate-wrap {
  position: relative;
  max-width: 640px;
  margin: 0 auto;
  padding: 10vh 20px 60px;
}
.ghost-x {
  position: absolute;
  top: 22px;
  right: 16px;
}
.gate-head {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  margin-bottom: 12px;
}
.gate-eyebrow {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.3em;
  color: var(--dim);
}
.gate-title {
  margin: 0;
  font-size: clamp(42px, 9vw, 76px);
  font-weight: 300;
  line-height: 0.98;
  letter-spacing: 0.01em;
}
.gate-lead {
  max-width: 40em;
  margin: 0 0 30px;
  color: var(--mute);
  font-size: 18px;
}
.gate-note {
  margin: -18px 0 24px;
  color: var(--dim);
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.6;
}
.gate-form {
  display: grid;
  gap: 16px;
}
.gate-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin-top: 8px;
}
.gate-foot {
  margin-top: 36px;
}
.setup-list {
  margin: 0 0 26px;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 12px;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--mute);
}
.setup-list li {
  padding-left: 16px;
  border-left: 1px solid var(--line-2);
  line-height: 1.7;
}
.setup-list b {
  color: var(--ink);
  font-weight: 500;
}
.copyable {
  display: inline-block;
  margin-top: 4px;
  padding: 2px 8px;
  border: 1px dashed var(--line-2);
  border-radius: var(--rad);
  background: var(--panel);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 12px;
  word-break: break-all;
  cursor: copy;
}
.copyable:hover {
  border-color: var(--ink);
}

/* ---------- сетка слов ---------- */

.seed-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.seed-cell {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  height: 46px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: var(--panel);
}
.seed-cell:focus-within {
  border-color: var(--ink);
}
.seed-num {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  min-width: 18px;
}
.seed-input {
  flex: 1;
  min-width: 0;
  height: 100%;
  border: 0;
  background: none;
  font-family: var(--mono);
  font-size: 14px;
}
.seed-input:focus {
  outline: none;
}
.seed-input.bad {
  color: var(--danger);
}
.seed-static {
  background: var(--panel-2);
}
.seed-word {
  font-family: var(--mono);
  font-size: 14px;
}
.seed-top {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 10px;
}
.eye-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 10px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: transparent;
  color: var(--mute);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}
.eye-btn:hover {
  color: var(--ink);
  border-color: var(--ink);
}
.eye-btn svg {
  width: 16px;
  height: 16px;
}

/* свой список подсказок слов (вместо браузерного datalist) */
.seed-cell {
  position: relative;
}
.ac {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  z-index: 12;
  margin: 0;
  padding: 2px;
  list-style: none;
  max-height: 184px;
  overflow: auto;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: var(--panel-2);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
}
.ac-item {
  padding: 7px 10px;
  border-radius: var(--rad);
  font-family: var(--mono);
  font-size: 13px;
  color: var(--mute);
  cursor: pointer;
}
.ac-item:hover,
.ac-item.on {
  background: var(--inv-bg);
  color: var(--inv-ink);
}

/* ---------- менеджер ---------- */

.shell-root {
  min-height: 100vh;
}
.shell {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 20px 120px;
}
.top {
  position: sticky;
  top: 0;
  z-index: 4;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px 20px;
  padding: 16px 0;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line-2);
}
.top-left {
  display: flex;
  align-items: baseline;
  gap: 16px;
  min-width: 0;
}
.brand {
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.3em;
  color: var(--dim);
  text-transform: uppercase;
}
.crumbs {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px 8px;
  min-width: 0;
  font-size: 24px;
  font-weight: 300;
}
.crumb {
  padding: 0;
  border: 0;
  background: none;
  color: var(--mute);
  cursor: pointer;
  overflow-wrap: anywhere;
  text-align: left;
}
button.crumb:hover {
  color: var(--ink);
}
.crumb.drop-into,
.crumb:hover {
  color: var(--ink);
}
.crumb-here {
  color: var(--ink);
  cursor: default;
}
.crumb-sep {
  color: var(--dim);
}
.tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}
.search {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 38px;
  padding: 0 10px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: var(--panel);
}
.search:focus-within {
  border-color: var(--ink);
}
.search-ic {
  color: var(--dim);
  display: grid;
}
.search-field {
  width: 150px;
  height: 100%;
  border: 0;
  background: none;
  font-family: var(--mono);
  font-size: 13px;
}
.search-field:focus {
  outline: none;
}

.selbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 13px;
}
.sel-count {
  color: var(--mute);
  letter-spacing: 0.06em;
}

.list {
  padding-top: 4px;
}
.row {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) 92px 70px auto;
  align-items: center;
  border-bottom: 1px solid var(--line);
}
.row:hover {
  background: var(--panel);
}
.row-sel {
  background: var(--panel-2);
}
.row.drop-into {
  outline: 1px dashed var(--ink);
  outline-offset: -1px;
}
.row-check {
  display: grid;
  place-items: center;
  width: 34px;
  height: 54px;
  border: 0;
  background: none;
  cursor: pointer;
}
.check-box {
  width: 15px;
  height: 15px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
}
.check-box.on {
  background: var(--inv-bg);
  border-color: var(--inv-bg);
}
.row:hover .check-box {
  border-color: var(--mute);
}
.row-open {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  height: 54px;
  padding: 0 4px;
  border: 0;
  background: none;
  text-align: left;
  cursor: pointer;
}
.row-open:disabled {
  cursor: default;
}
.row-icon {
  display: grid;
  place-items: center;
  flex: none;
  width: 26px;
  height: 26px;
  color: var(--mute);
  position: relative;
}
.kind-folder {
  color: var(--ink);
}
.row-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 17px;
}
.row-size,
.row-date {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--mute);
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.row-actions {
  display: flex;
  justify-content: flex-end;
  padding-left: 6px;
  opacity: 0;
}
.row:hover .row-actions,
.row:focus-within .row-actions {
  opacity: 1;
}
@media (hover: none) {
  .row-actions {
    opacity: 1;
  }
}
.row-actions .icon-btn {
  width: 34px;
  height: 34px;
}
.row-locked .row-name {
  color: var(--dim);
  font-style: italic;
}

.as-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
  padding-top: 18px;
}
.as-grid .row {
  position: relative;
  display: block;
  border: 1px solid var(--line);
  border-radius: var(--rad);
  background: var(--panel);
  padding: 0;
}
.as-grid .row:hover {
  border-color: var(--line-2);
}
.as-grid .row-check {
  position: absolute;
  top: 4px;
  left: 4px;
  z-index: 2;
  width: 30px;
  height: 30px;
  opacity: 0;
}
.as-grid .row:hover .row-check,
.as-grid .row-sel .row-check {
  opacity: 1;
}
.as-grid .row-open {
  display: grid;
  gap: 0;
  width: 100%;
  height: auto;
  padding: 0;
}
.as-grid .row-icon {
  width: 100%;
  height: auto;
  aspect-ratio: 1;
  border-bottom: 1px solid var(--line);
  background: var(--panel-2);
  overflow: hidden;
}
.as-grid .row-icon svg {
  width: 38px;
  height: 38px;
}
.as-grid .row-icon img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.as-grid .has-thumb svg {
  visibility: hidden;
}
.as-grid .row-name {
  padding: 9px 10px;
  font-size: 14px;
}
.as-grid .row-size,
.as-grid .row-date {
  display: none;
}
.as-grid .row-actions {
  position: absolute;
  top: 4px;
  right: 4px;
  border: 1px solid var(--line);
  border-radius: var(--rad);
  background: var(--panel);
}

.loading {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 60px 0;
  color: var(--mute);
  font-family: var(--mono);
  font-size: 13px;
}
.empty {
  padding: 80px 0;
  color: var(--mute);
}
.empty p {
  margin: 0;
}
.empty-title {
  margin-bottom: 8px !important;
  color: var(--ink);
  font-size: 30px;
  font-weight: 300;
}
.foot {
  padding-top: 20px;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--dim);
}

/* ---------- панель загрузок ---------- */

.dock {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 15;
  width: min(360px, calc(100vw - 36px));
  max-height: 46vh;
  overflow: auto;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: var(--panel);
}
.dock-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 42px;
  padding: 4px 6px 4px 14px;
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--mute);
}
.job {
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
}
.job:last-child {
  border-bottom: 0;
}
.job-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 26px;
}
.job-row .icon-btn {
  width: 26px;
  height: 26px;
}
.job-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 15px;
}
.job-status {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--mute);
}
.job-error .job-status {
  color: var(--danger);
}
.bar {
  height: 2px;
  margin: 6px 0;
  background: var(--line-2);
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  background: var(--ink);
  transition: width 0.2s;
}

.drop {
  position: fixed;
  inset: 10px;
  z-index: 20;
  display: grid;
  place-items: center;
  border: 1px dashed var(--ink);
  border-radius: var(--rad);
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  font-family: var(--mono);
  font-size: 16px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  pointer-events: none;
}

/* ---------- окна / сообщения ---------- */

.dlg {
  width: min(440px, calc(100vw - 32px));
  padding: 24px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: var(--panel);
  color: var(--ink);
}
.dlg::backdrop {
  background: rgba(0, 0, 0, 0.7);
}
.dlg h2 {
  margin: 0 0 8px;
  font-size: 26px;
  font-weight: 300;
}
.dlg p {
  margin: 0 0 14px;
  color: var(--mute);
}
.dlg-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
}
#toasts {
  position: fixed;
  left: 18px;
  bottom: 18px;
  z-index: 40;
  display: grid;
  gap: 8px;
  width: min(440px, calc(100vw - 36px));
}
.toast {
  padding: 12px 14px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: var(--panel-2);
  font-family: var(--mono);
  font-size: 13px;
  overflow-wrap: anywhere;
}
.toast-error {
  border-color: var(--danger);
  color: var(--danger);
}

/* ---------- просмотр ---------- */

.viewer {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  background: #050506;
}
.viewer-top {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px 10px 18px;
  border-bottom: 1px solid var(--line);
}
.viewer-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.viewer-meta {
  flex: 1;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--mute);
  white-space: nowrap;
}
.viewer-extra {
  display: flex;
}
.stage {
  display: grid;
  place-items: center;
  min-height: 0;
  padding: 0 14px 14px;
}
.stage-note {
  max-width: 32em;
  text-align: center;
  color: var(--mute);
  font-family: var(--mono);
  font-size: 13px;
}
.stage-img,
.stage-media {
  max-width: 100%;
  max-height: 100%;
  min-height: 0;
  object-fit: contain;
}
.stage-frame {
  width: 100%;
  height: 100%;
  border: 0;
  background: #fff;
  border-radius: var(--rad);
}
.viewer-nav {
  position: absolute;
  top: 50%;
  display: grid;
  place-items: center;
  width: 42px;
  height: 64px;
  margin-top: -32px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: rgba(8, 8, 9, 0.7);
  color: var(--ink);
  cursor: pointer;
}
.viewer-nav:hover {
  border-color: var(--ink);
}
.viewer-prev {
  left: 10px;
}
.viewer-next {
  right: 10px;
}
.hidden-frame {
  position: absolute;
  width: 0;
  height: 0;
  border: 0;
  visibility: hidden;
}

/* ---------- редактор ---------- */

.editor {
  position: fixed;
  inset: 0;
  z-index: 32;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  background: var(--bg);
}
.ed-top {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px 10px 18px;
  border-bottom: 1px solid var(--line-2);
}
.ed-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 18px;
}
.ed-tabs {
  display: flex;
  gap: 4px;
  margin-left: auto;
}
.ed-tab {
  height: 30px;
  padding: 0 12px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: none;
  color: var(--mute);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}
.ed-tab.on {
  color: var(--inv-ink);
  background: var(--inv-bg);
  border-color: var(--inv-bg);
}
.ed-status {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--mute);
  min-width: 90px;
  text-align: right;
}
.ed-stage {
  min-height: 0;
  display: grid;
}
.ed-text {
  width: 100%;
  height: 100%;
  padding: 24px clamp(16px, 8vw, 120px);
  border: 0;
  background: var(--bg);
  resize: none;
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.7;
}
.ed-text:focus {
  outline: none;
}
.ed-preview {
  overflow: auto;
  padding: 24px clamp(16px, 8vw, 120px);
}

.md {
  font-size: 16px;
  line-height: 1.7;
}
.md h1,
.md h2,
.md h3 {
  font-weight: 400;
  line-height: 1.2;
  margin: 1.4em 0 0.5em;
}
.md h1 {
  font-size: 34px;
}
.md h2 {
  font-size: 26px;
}
.md h3 {
  font-size: 20px;
}
.md a {
  color: var(--ink);
}
.md code {
  font-family: var(--mono);
  font-size: 0.88em;
  padding: 1px 5px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
}
.md pre {
  padding: 14px 16px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: var(--panel);
  overflow: auto;
}
.md pre code {
  border: 0;
  padding: 0;
}
.md blockquote {
  margin: 1em 0;
  padding-left: 16px;
  border-left: 2px solid var(--line-2);
  color: var(--mute);
}
.md table {
  border-collapse: collapse;
}
.md th,
.md td {
  border: 1px solid var(--line-2);
  padding: 6px 10px;
}
.md img {
  max-width: 100%;
}

/* ---------- плеер ---------- */

.player {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 18;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 16px;
  border-top: 1px solid var(--line-2);
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  backdrop-filter: blur(10px);
}
.pl-ic {
  display: grid;
  color: var(--mute);
  flex: none;
}
.pl-main {
  flex: 1;
  min-width: 0;
}
.pl-title {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 15px;
}
.pl-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
}
.pl-controls .icon-btn {
  width: 32px;
  height: 32px;
}
.pl-time {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--mute);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.pl-seek {
  flex: 1;
  min-width: 60px;
  height: 2px;
  -webkit-appearance: none;
  appearance: none;
  background: var(--line-2);
  cursor: pointer;
}
.pl-seek::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--ink);
}
.pl-seek::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border: 0;
  border-radius: 50%;
  background: var(--ink);
}

/* ---------- анимации ---------- */

.cover-wrap {
  animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.cover-clock {
  animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both, flicker 6s steps(1) 1s infinite;
}
@keyframes flicker {
  0%, 97%, 100% { opacity: 1; }
  97.5% { opacity: 0.35; }
  98% { opacity: 1; }
  98.5% { opacity: 0.55; }
}
/* бегущая строка-скан по обложке */
.cover::after {
  content: '';
  position: fixed;
  left: 0;
  right: 0;
  top: 0;
  height: 140px;
  pointer-events: none;
  z-index: 0;
  background: linear-gradient(to bottom, transparent, rgba(237, 237, 240, 0.05), transparent);
  animation: sweep 7s linear infinite;
}
@keyframes sweep {
  from { transform: translateY(-140px); }
  to { transform: translateY(100vh); }
}

@keyframes rise {
  from { opacity: 0; transform: translateY(12px); }
}

/* появление панели входа/настройки и ячеек по очереди */
.gate-enter {
  animation: rise 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.gate-enter .seed-cell {
  animation: cellIn 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
@keyframes cellIn {
  from { opacity: 0; transform: translateY(8px); }
}
.gate-enter .seed-cell:nth-child(1) { animation-delay: 0.04s; }
.gate-enter .seed-cell:nth-child(2) { animation-delay: 0.08s; }
.gate-enter .seed-cell:nth-child(3) { animation-delay: 0.12s; }
.gate-enter .seed-cell:nth-child(4) { animation-delay: 0.16s; }
.gate-enter .seed-cell:nth-child(5) { animation-delay: 0.2s; }
.gate-enter .seed-cell:nth-child(6) { animation-delay: 0.24s; }
.gate-enter .seed-cell:nth-child(7) { animation-delay: 0.28s; }
.gate-enter .seed-cell:nth-child(8) { animation-delay: 0.32s; }
.gate-enter .seed-cell:nth-child(9) { animation-delay: 0.36s; }
.gate-enter .seed-cell:nth-child(10) { animation-delay: 0.4s; }
.gate-enter .seed-cell:nth-child(11) { animation-delay: 0.44s; }
.gate-enter .seed-cell:nth-child(12) { animation-delay: 0.48s; }

.seed-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 2px;
}
.remember {
  margin-top: 2px;
}
.cbx {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 0;
  border: 0;
  background: none;
  text-align: left;
  cursor: pointer;
  color: var(--ink);
}
.cbx-box {
  flex: none;
  width: 18px;
  height: 18px;
  margin-top: 1px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  position: relative;
}
.cbx:hover .cbx-box {
  border-color: var(--ink);
}
.cbx-box.on {
  background: var(--inv-bg);
  border-color: var(--inv-bg);
}
.cbx-box.on::after {
  content: '';
  position: absolute;
  left: 5px;
  top: 1px;
  width: 5px;
  height: 10px;
  border: solid var(--inv-ink);
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.cbx-label {
  display: block;
  font-size: 15px;
  line-height: 1.35;
}
.cbx-hint {
  display: block;
  margin-top: 2px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.02em;
  color: var(--dim);
}
.seed-hint {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--mute);
}

/* глитч заголовка — монохромный, редкими всплесками */
.glitch {
  position: relative;
}
.glitch::before,
.glitch::after {
  content: attr(data-text);
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  overflow: hidden;
  pointer-events: none;
}
.glitch::before {
  color: #fff;
  opacity: 0.55;
  animation: glitchTop 5s steps(2) infinite;
}
.glitch::after {
  color: var(--mute);
  animation: glitchBottom 5s steps(2) infinite;
}
@keyframes glitchTop {
  0%, 92%, 100% { transform: none; clip-path: inset(0 0 100% 0); opacity: 0; }
  93% { transform: translate(-3px, -1px); clip-path: inset(0 0 55% 0); opacity: 0.6; }
  95% { transform: translate(3px, 1px); clip-path: inset(0 0 60% 0); opacity: 0.6; }
  97% { transform: translate(-2px, 0); clip-path: inset(0 0 50% 0); opacity: 0.6; }
}
@keyframes glitchBottom {
  0%, 92%, 100% { transform: none; clip-path: inset(100% 0 0 0); opacity: 0; }
  93.5% { transform: translate(3px, 1px); clip-path: inset(55% 0 0 0); opacity: 0.5; }
  95.5% { transform: translate(-3px, -1px); clip-path: inset(60% 0 0 0); opacity: 0.5; }
  97.5% { transform: translate(2px, 0); clip-path: inset(50% 0 0 0); opacity: 0.5; }
}



/* наведение на строки/кнопки — мягкое */
.row,
.btn,
.btn-line,
.icon-btn,
.seed-cell {
  transition: background 0.14s, border-color 0.14s, color 0.14s, transform 0.14s;
}
.as-grid .row:hover {
  transform: translateY(-2px);
}

/* =====================================================================
   LUX CYBER — слой оформления: переходы, HUD, лог, полосы, скелетоны,
   состояния. Всё монохромно; красный — только для ошибок.
   ===================================================================== */

/* --- атмосфера: зерно + виньетка + сетка, гаснущая к краям --- */
body::before {
  background-image: linear-gradient(var(--hair) 1px, transparent 1px), linear-gradient(90deg, var(--hair) 1px, transparent 1px);
  background-size: 56px 56px;
  opacity: 0.35;
  -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%);
  mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%);
}
body::after {
  content: '';
  position: fixed;
  inset: -50%;
  z-index: 60;
  pointer-events: none;
  opacity: 0.055;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation: grain 1.2s steps(4) infinite;
}
@keyframes grain {
  0% { transform: translate(0, 0); }
  25% { transform: translate(-3%, 2%); }
  50% { transform: translate(2%, -3%); }
  75% { transform: translate(-2%, -1%); }
}
#app::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  background: radial-gradient(ellipse at 50% 35%, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
}

/* --- переходы между экранами (View Transitions + запасной вариант) --- */
::view-transition-old(root) {
  animation: vt-out 0.26s var(--ease) both;
}
::view-transition-new(root) {
  animation: vt-in 0.5s var(--ease) both;
}
@keyframes vt-out {
  to { opacity: 0; filter: blur(6px) brightness(1.6); transform: scale(0.99); }
}
@keyframes vt-in {
  0% { opacity: 0; filter: blur(10px); clip-path: inset(0 0 100% 0); }
  60% { filter: blur(0); }
  100% { opacity: 1; clip-path: inset(0); }
}
#app.screen-out {
  animation: vt-out 0.16s var(--ease) both;
}
#app.screen-in {
  animation: vt-in 0.45s var(--ease) both;
}

/* --- HUD-уголки --- */
.boot,
.decrypt-panel,
.state-panel,
.drop-core {
  position: relative;
}
.hud::before,
.hud::after {
  content: '';
  position: absolute;
  width: 12px;
  height: 12px;
  pointer-events: none;
  border-color: var(--ink);
  border-style: solid;
  opacity: 0.75;
}
.hud::before {
  top: -1px;
  left: -1px;
  border-width: 1px 0 0 1px;
}
.hud::after {
  right: -1px;
  bottom: -1px;
  border-width: 0 1px 1px 0;
}

/* --- полоса сетевой активности --- */
.netbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  z-index: 80;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
  background: linear-gradient(90deg, transparent, var(--ink) 45%, #fff 50%, var(--ink) 55%, transparent);
  background-size: 40% 100%;
  background-repeat: no-repeat;
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}
.netbar.on {
  opacity: 1;
  animation: netsweep 1s linear infinite;
}
@keyframes netsweep {
  from { background-position: -40% 0; }
  to { background-position: 140% 0; }
}

/* --- сегментные полосы --- */
.seg {
  display: flex;
  gap: 2px;
  height: 6px;
  width: 100%;
}
.seg i {
  flex: 1;
  background: var(--line-2);
  transition: background 0.18s, box-shadow 0.18s;
}
.seg i.on {
  background: var(--ink);
  box-shadow: 0 0 8px rgba(255, 255, 255, 0.35);
}
.seg.busy i.on:last-of-type,
.seg.busy i.on:has(+ i:not(.on)) {
  animation: segblink 0.7s steps(2) infinite;
}
@keyframes segblink {
  50% { background: var(--mute); box-shadow: none; }
}
.seg-meter {
  width: 120px;
  height: 4px;
}
.seg-meter[data-level='low'] i.on {
  background: var(--danger);
  box-shadow: none;
}
.seg-meter[data-level='mid'] i.on {
  background: var(--mute);
  box-shadow: none;
}
.seg-quota {
  width: 84px;
  height: 4px;
}
.seg-job,
.seg-dock {
  height: 4px;
}
.seg-dock {
  padding: 0 14px 10px;
  height: 14px;
}

/* --- терминальный лог шагов --- */
.log-slot {
  margin-top: 4px;
}
.log-slot:empty {
  display: none;
}
.boot {
  padding: 16px 18px 14px;
  border: 1px solid var(--hair-2);
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  animation: rise 0.45s var(--ease) both;
}
.boot-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.boot-title {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  color: var(--mute);
}
.boot-pct {
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 300;
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
}
.boot-lines {
  display: grid;
  gap: 5px;
  margin-top: 12px;
  font-family: var(--mono);
  font-size: 12px;
}
.boot-line {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
  animation: lineIn 0.3s var(--ease) both;
}
@keyframes lineIn {
  from { opacity: 0; transform: translateX(-6px); }
}
.boot-pfx {
  color: var(--dim);
}
.boot-label {
  color: var(--ink);
  letter-spacing: 0.08em;
  flex: none;
}
.boot-sub {
  color: var(--dim);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.boot-st {
  flex: none;
  color: var(--mute);
  font-variant-numeric: tabular-nums;
}
.boot-line.run .boot-st::before {
  content: '⠋';
  display: inline-block;
  color: var(--ink);
  animation: braille 0.8s steps(1) infinite;
}
@keyframes braille {
  0% { content: '⠋'; }
  12% { content: '⠙'; }
  25% { content: '⠹'; }
  37% { content: '⠸'; }
  50% { content: '⠼'; }
  62% { content: '⠴'; }
  75% { content: '⠦'; }
  87% { content: '⠧'; }
}
.boot-line.ok .boot-st::before {
  content: '✓ ';
  color: var(--ink);
}
.boot-line.err .boot-label,
.boot-line.err .boot-st,
.boot-line.err .boot-sub {
  color: var(--danger);
}
.boot.done {
  border-color: var(--hair-2);
  box-shadow: var(--glow);
}

/* --- экран входа: состояния сетки слов --- */
.seed-top {
  justify-content: space-between;
  align-items: center;
}
.seed-cap {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.22em;
  color: var(--dim);
}
.seed-grid {
  position: relative;
}
.seed-cell {
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
}
.seed-cell:focus-within {
  box-shadow: 0 0 0 1px var(--ink), var(--glow);
}
.seed-grid.sealing .seed-cell {
  border-color: var(--hair-2);
  animation: sealPulse 1.1s ease-in-out infinite;
}
.seed-grid.sealing::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  height: 2px;
  top: 0;
  background: linear-gradient(90deg, transparent, var(--ink), transparent);
  box-shadow: 0 0 14px rgba(255, 255, 255, 0.5);
  animation: sealScan 1.2s var(--ease) infinite;
}
@keyframes sealPulse {
  50% { background: var(--panel-2); }
}
@keyframes sealScan {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(210px); opacity: 0; }
}
.seed-grid.denied {
  animation: shake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
}
.seed-grid.denied .seed-cell {
  border-color: var(--danger);
}
@keyframes shake {
  20%, 80% { transform: translateX(-3px); }
  40%, 60% { transform: translateX(4px); }
}
.seed-strength {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* --- кнопки: благородная реакция --- */
.btn,
.btn-line {
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s, background 0.2s, color 0.2s, box-shadow 0.25s;
}
.btn::after,
.btn-line::after {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  width: 40%;
  left: -60%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.16), transparent);
  transform: skewX(-18deg);
  transition: left 0s;
  pointer-events: none;
}
.btn:hover::after,
.btn-line:hover::after {
  left: 130%;
  transition: left 0.7s var(--ease);
}
.btn-primary:hover {
  box-shadow: 0 0 26px rgba(255, 255, 255, 0.22);
}
.btn.is-busy {
  color: transparent !important;
}
.btn.is-busy::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(-45deg, transparent 0 8px, rgba(5, 5, 6, 0.18) 8px 16px);
  background-size: 22px 22px;
  animation: stripes 0.6s linear infinite;
}
.btn.is-busy > span {
  visibility: hidden;
}
@keyframes stripes {
  to { background-position: 22px 0; }
}

/* --- шапка менеджера --- */
.top {
  background: linear-gradient(to bottom, rgba(5, 5, 6, 0.92), rgba(5, 5, 6, 0.72));
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--hair-2);
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.brand-mark {
  width: 7px;
  height: 7px;
  background: var(--ink);
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
  animation: blink 2.4s steps(1) infinite;
}
.crumb-here {
  text-shadow: 0 0 18px rgba(255, 255, 255, 0.15);
}

/* --- строки списка --- */
.row {
  position: relative;
  border-bottom-color: var(--hair);
}
.row::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--ink);
  transform: scaleY(0);
  transition: transform 0.25s var(--ease);
}
.as-rows .row:hover::before,
.as-rows .row-sel::before {
  transform: scaleY(1);
}
.as-rows .row:hover {
  background: linear-gradient(90deg, rgba(255, 255, 255, 0.045), transparent 70%);
}
.list.fresh .row {
  animation: rowIn 0.5s var(--ease) both;
  animation-delay: calc(var(--i, 0) * 24ms);
}
@keyframes rowIn {
  from { opacity: 0; transform: translateY(8px); filter: blur(3px); }
}
.list.refreshing {
  position: relative;
}
.list.refreshing::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--ink), transparent);
  background-size: 30% 100%;
  background-repeat: no-repeat;
  animation: netsweep 1.1s linear infinite;
}

/* расшифровка имени поверх настоящего текста */
.decoding {
  position: relative;
  color: transparent !important;
}
.decoding::after {
  content: attr(data-scr);
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  color: var(--ink);
  white-space: pre;
  overflow: hidden;
}

/* плитка */
.as-grid .row {
  background: var(--glass);
  border-color: var(--hair);
  transition: transform 0.3s var(--ease), border-color 0.25s, box-shadow 0.3s;
}
.as-grid .row:hover {
  border-color: var(--hair-2);
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5), var(--glow);
}
.as-grid .row-icon img {
  animation: imgIn 0.6s var(--ease) both;
}
@keyframes imgIn {
  from { opacity: 0; filter: blur(8px) brightness(1.8); transform: scale(1.04); }
}
.thumb-wait,
.skel {
  background: linear-gradient(100deg, rgba(255, 255, 255, 0.03) 30%, rgba(255, 255, 255, 0.09) 50%, rgba(255, 255, 255, 0.03) 70%);
  background-size: 220% 100%;
  animation: shimmer 1.4s linear infinite;
}
@keyframes shimmer {
  from { background-position: 120% 0; }
  to { background-position: -120% 0; }
}

/* --- скелетоны --- */
.skel-caption {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 0 10px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--dim);
  text-transform: uppercase;
}
.skel-row {
  display: grid;
  grid-template-columns: 34px 28px minmax(0, 1fr) 92px 70px;
  align-items: center;
  gap: 12px;
  height: 54px;
  border-bottom: 1px solid var(--hair);
  animation: rowIn 0.5s var(--ease) both;
  animation-delay: var(--d, 0ms);
}
.skel {
  display: block;
  height: 10px;
  border-radius: 1px;
}
.skel-box {
  width: 15px;
  height: 15px;
  margin-left: 10px;
}
.skel-ic {
  width: 22px;
  height: 22px;
}
.skel-name {
  width: var(--w, 50%);
  height: 12px;
}
.skel-meta {
  width: 60px;
  justify-self: end;
}
.skel-meta2 {
  width: 50px;
  justify-self: end;
}
.skel-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
  padding-top: 4px;
}
.skel-grid .skel-caption {
  grid-column: 1 / -1;
}
.skel-tile {
  border: 1px solid var(--hair);
  animation: rowIn 0.5s var(--ease) both;
  animation-delay: var(--d, 0ms);
}
.skel-thumb {
  height: auto;
  aspect-ratio: 1;
  border-radius: 0;
}
.skel-cap {
  width: 70%;
  margin: 12px 10px;
}
.skel-text {
  position: absolute;
  inset: 0;
  display: grid;
  align-content: start;
  gap: 14px;
  padding: 28px clamp(16px, 8vw, 120px);
}
.skel-line {
  width: var(--w, 60%);
  height: 11px;
  animation: shimmer 1.4s linear infinite, rowIn 0.5s var(--ease) both;
  animation-delay: 0s, var(--d, 0ms);
}

/* --- состояния: пусто / ошибка --- */
.state-panel {
  display: grid;
  justify-items: start;
  gap: 8px;
  max-width: 560px;
  margin: 56px 0;
  padding: 30px 32px;
  border: 1px solid var(--hair);
  background: var(--glass);
  animation: rise 0.5s var(--ease) both;
}
.state-code {
  font-family: var(--mono);
  font-size: 44px;
  font-weight: 200;
  line-height: 1;
  letter-spacing: 0.04em;
  color: var(--ink);
  text-shadow: 0 0 24px rgba(255, 255, 255, 0.18);
}
.state-title {
  margin: 6px 0 0;
  font-size: 26px;
  font-weight: 300;
}
.state-text {
  margin: 0 0 10px;
  color: var(--mute);
  max-width: 44em;
}
.state-err .state-code {
  color: var(--danger);
  text-shadow: 0 0 24px rgba(255, 91, 82, 0.3);
}
.empty.state-panel {
  padding-top: 30px;
}
.empty .empty-title {
  margin: 6px 0 0 !important;
}

/* --- статус-строка --- */
.statusbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 16;
  display: flex;
  align-items: center;
  gap: 0;
  height: 30px;
  padding: 0 14px;
  overflow-x: auto;
  scrollbar-width: none;
  border-top: 1px solid var(--hair-2);
  background: rgba(5, 5, 6, 0.86);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.12em;
  white-space: nowrap;
}
.statusbar::-webkit-scrollbar {
  display: none;
}
.st-cell {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  border-right: 1px solid var(--hair);
  height: 100%;
}
.st-k {
  color: var(--dim);
}
.st-v {
  color: var(--ink);
}
.st-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  border: 1px solid var(--ink);
}
.st-link.up .st-dot {
  background: var(--ink);
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
  animation: pulse 2s ease-in-out infinite;
}
.st-link.down .st-v {
  color: var(--danger);
}
.st-link.down .st-dot {
  border-color: var(--danger);
}
@keyframes pulse {
  50% { box-shadow: 0 0 2px rgba(255, 255, 255, 0.3); opacity: 0.6; }
}
.shell {
  padding-bottom: 150px;
}

/* --- панель загрузок --- */
.dock {
  bottom: 44px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  border-color: var(--hair-2);
  border-radius: 0;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
  animation: rise 0.4s var(--ease) both;
}
.dock-head {
  gap: 10px;
  border-bottom: 0;
}
.dock-title {
  flex: 1;
  letter-spacing: 0.16em;
}
.dock-count {
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.job {
  border-top: 1px solid var(--hair);
  border-bottom: 0;
  animation: lineIn 0.3s var(--ease) both;
}
.job-row {
  gap: 10px;
}
.job-dir {
  font-family: var(--mono);
  color: var(--mute);
  width: 12px;
  flex: none;
}
.job-name {
  flex: 1;
  min-width: 0;
}
.job-chip {
  flex: none;
  padding: 2px 6px;
  border: 1px solid var(--hair-2);
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.12em;
  color: var(--mute);
}
.job-run .job-chip {
  color: var(--inv-ink);
  background: var(--ink);
  border-color: var(--ink);
}
.job-done .job-chip {
  color: var(--ink);
}
.job-error .job-chip {
  color: var(--danger);
  border-color: var(--danger);
}
.job .seg {
  margin: 8px 0 6px;
}
.job-status {
  font-variant-numeric: tabular-nums;
}

/* --- зона перетаскивания --- */
.drop {
  border: 0;
  background: rgba(5, 5, 6, 0.78);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  animation: fadeIn 0.2s ease both;
}
.drop-core {
  display: grid;
  justify-items: center;
  gap: 10px;
  padding: 46px 60px;
  background:
    linear-gradient(90deg, var(--ink) 50%, transparent 0) top / 14px 1px repeat-x,
    linear-gradient(90deg, var(--ink) 50%, transparent 0) bottom / 14px 1px repeat-x,
    linear-gradient(0deg, var(--ink) 50%, transparent 0) left / 1px 14px repeat-y,
    linear-gradient(0deg, var(--ink) 50%, transparent 0) right / 1px 14px repeat-y;
  animation: ants 0.8s linear infinite;
}
@keyframes ants {
  to { background-position: 14px 0, -14px 100%, 0 -14px, 100% 14px; }
}
.drop-ic svg {
  width: 34px;
  height: 34px;
  animation: floaty 1.4s ease-in-out infinite;
}
@keyframes floaty {
  50% { transform: translateY(-5px); }
}
.drop p {
  margin: 0;
}
.drop-sub {
  font-size: 10.5px;
  letter-spacing: 0.14em;
  color: var(--dim);
  text-transform: none;
}
@keyframes fadeIn {
  from { opacity: 0; }
}

/* --- сообщения --- */
#toasts {
  bottom: 44px;
}
.toast {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  overflow: hidden;
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-color: var(--hair-2);
  border-radius: 0;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
  animation: toastIn 0.4s var(--ease) both;
}
.toast.out {
  animation: toastOut 0.26s ease both;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(12px); filter: blur(4px); }
}
@keyframes toastOut {
  to { opacity: 0; transform: translateX(-12px); }
}
.toast-mark {
  flex: none;
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border: 1px solid currentColor;
  font-size: 11px;
}
.toast-text {
  flex: 1;
}
.toast-timer {
  position: absolute;
  left: 0;
  bottom: 0;
  height: 1px;
  width: 100%;
  background: currentColor;
  opacity: 0.5;
  transform-origin: left;
  animation: timer var(--life, 4500ms) linear both;
}
@keyframes timer {
  to { transform: scaleX(0); }
}
.toast-ok {
  color: var(--ink);
}

/* --- диалоги --- */
.dlg {
  background: var(--glass);
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
  border-color: var(--hair-2);
  border-radius: 0;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
  overflow: visible;
}
.dlg[open] {
  animation: dlgIn 0.36s var(--ease) both;
}
.dlg::backdrop {
  background: rgba(0, 0, 0, 0.6);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
}
@keyframes dlgIn {
  from { opacity: 0; transform: translateY(10px) scale(0.98); filter: blur(4px); }
}

/* --- просмотр --- */
.viewer {
  background: rgba(3, 3, 4, 0.96);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  animation: fadeIn 0.25s ease both;
}
.viewer-top {
  border-bottom-color: var(--hair);
}
.viewer-kind {
  display: grid;
  color: var(--mute);
}
.decrypt-panel {
  width: min(460px, 92vw);
  padding: 22px 22px 18px;
  border: 1px solid var(--hair-2);
  background: var(--glass);
  animation: rise 0.4s var(--ease) both;
}
.dp-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 14px;
}
.dp-title {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.24em;
  color: var(--mute);
}
.dp-pct {
  font-family: var(--mono);
  font-size: 30px;
  font-weight: 200;
  font-variant-numeric: tabular-nums;
}
.decrypt-panel .seg {
  height: 8px;
}
.dp-foot {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 12px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  color: var(--dim);
}
.dp-bytes {
  color: var(--mute);
  font-variant-numeric: tabular-nums;
}
.stage-img.reveal {
  animation: reveal 0.9s var(--ease) both;
}
@keyframes reveal {
  0% { clip-path: inset(0 0 100% 0); filter: grayscale(1) brightness(2.2) contrast(1.4); }
  55% { filter: grayscale(0.6) brightness(1.2); }
  100% { clip-path: inset(0); filter: none; }
}
.video-wrap {
  position: relative;
  display: grid;
  place-items: center;
  max-width: 100%;
  max-height: 100%;
  min-height: 0;
}
.video-wrap .stage-media {
  max-height: calc(100vh - 90px);
}
.buffering {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 14px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s;
  background: rgba(0, 0, 0, 0.35);
}
.buffering.on {
  opacity: 1;
}
.ring {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: conic-gradient(var(--ink) 0 25%, transparent 25% 50%, var(--ink) 50% 62%, transparent 62%);
  -webkit-mask: radial-gradient(circle, transparent 17px, #000 18px);
  mask: radial-gradient(circle, transparent 17px, #000 18px);
  animation: spin 0.9s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.buf-text {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  color: var(--mute);
}
.stage .state-panel {
  margin: 0;
}

/* --- редактор --- */
.editor {
  animation: fadeIn 0.25s ease both;
}
.ed-top {
  background: rgba(5, 5, 6, 0.9);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}
.ed-kind {
  display: grid;
  color: var(--mute);
}
.ed-count {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  white-space: nowrap;
}
.ed-stage {
  position: relative;
}
.ed-stage.is-loading .ed-text {
  opacity: 0;
}
.ed-status {
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  white-space: nowrap;
}
.ed-status::before {
  content: '';
  font-family: var(--mono);
}
.ed-status[data-state='dirty']::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ink);
  animation: blink 1s steps(1) infinite;
}
.ed-status[data-state='busy']::before {
  content: '⠋';
  color: var(--ink);
  animation: braille 0.8s steps(1) infinite;
}
.ed-status[data-state='saved'] {
  color: var(--ink);
  animation: savedFlash 0.8s ease both;
}
.ed-status[data-state='saved']::before {
  content: '✓';
}
.ed-status[data-state='error'] {
  color: var(--danger);
}
@keyframes savedFlash {
  0% { text-shadow: 0 0 18px #fff; }
}

/* --- плеер --- */
.player {
  bottom: 30px;
  background: rgba(8, 8, 10, 0.9);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  border-top-color: var(--hair-2);
  animation: rise 0.35s var(--ease) both;
}
.pl-line {
  display: flex;
  align-items: baseline;
  gap: 10px;
  min-width: 0;
}
.pl-line .pl-title {
  flex: 1;
  min-width: 0;
}
.pl-chip {
  flex: none;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.16em;
  color: var(--mute);
}
.pl-chip[data-state='play'] {
  color: var(--ink);
}
.pl-chip[data-state='load'] {
  animation: blink 0.9s steps(1) infinite;
}
.pl-chip[data-state='error'] {
  color: var(--danger);
}
.eq {
  display: inline-flex;
  align-items: flex-end;
  gap: 2px;
  height: 18px;
}
.eq i {
  width: 3px;
  height: 4px;
  background: var(--mute);
}
.player[data-state='play'] .eq i {
  background: var(--ink);
  animation: eq 0.9s ease-in-out infinite;
}
.player[data-state='play'] .eq i:nth-child(2) { animation-delay: -0.2s; }
.player[data-state='play'] .eq i:nth-child(3) { animation-delay: -0.45s; }
.player[data-state='play'] .eq i:nth-child(4) { animation-delay: -0.1s; }
.player[data-state='play'] .eq i:nth-child(5) { animation-delay: -0.65s; }
@keyframes eq {
  0%, 100% { height: 4px; }
  50% { height: 18px; }
}
.pl-track {
  position: relative;
  flex: 1;
  min-width: 60px;
  height: 18px;
  cursor: pointer;
  touch-action: none;
}
.pl-track::before {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 8px;
  height: 2px;
  background: var(--line-2);
}
.pl-buf,
.pl-fill {
  position: absolute;
  left: 0;
  top: 8px;
  height: 2px;
  width: calc(var(--p, 0) * 100%);
}
.pl-buf {
  background: var(--dim);
}
.pl-fill {
  background: var(--ink);
  box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
}
.pl-knob {
  position: absolute;
  top: 4px;
  left: calc(var(--p, 0) * 100%);
  width: 10px;
  height: 10px;
  margin-left: -5px;
  background: var(--ink);
  transform: rotate(45deg) scale(0);
  transition: transform 0.2s var(--ease);
}
.pl-track:hover .pl-knob,
.pl-track:focus-visible .pl-knob {
  transform: rotate(45deg) scale(1);
}

/* --- экран закрытия и автовход --- */
.lock-veil {
  position: fixed;
  inset: 0;
  z-index: 90;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(3, 3, 4, 0.9);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  animation: fadeIn 0.25s ease both;
}
.lock-veil .boot {
  width: min(520px, 100%);
}
.gate-boot .boot {
  margin-top: 24px;
}

/* --- выпадающие подсказки слов --- */
.ac {
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-color: var(--hair-2);
  animation: rise 0.2s var(--ease) both;
}


/* --- правки после ревью --- */
body {
  font-weight: 300;
}
b,
strong,
.md strong,
.cbx-label,
.crumb-here,
.empty-title,
.state-title {
  font-weight: 500;
}
.row-name {
  font-weight: 300;
  letter-spacing: 0.01em;
}
.ghost-x {
  border: 1px solid var(--hair-2);
  background: rgba(5, 5, 6, 0.6);
  color: var(--mute);
}
.ghost-x:hover {
  color: var(--ink);
  border-color: var(--ink);
}
.btn.is-busy {
  color: inherit !important;
}
.btn.is-busy > span {
  visibility: visible;
  position: relative;
  z-index: 1;
}
.btn-primary.is-busy {
  background: var(--panel-2);
  border-color: var(--hair-2);
  color: var(--ink) !important;
}
.btn.is-busy::before {
  background: repeating-linear-gradient(-45deg, transparent 0 8px, rgba(255, 255, 255, 0.07) 8px 16px);
}

/* сетка слов не вылезает за экран */
.seed-grid {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
@media (max-width: 460px) {
  .seed-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
.seed-cell {
  min-width: 0;
}

/* скелетон списка */
.skel-list {
  display: block;
  padding: 0;
}
.skel-caption .scanner {
  width: 40px;
}
.thumb-wait,
.skel {
  background: linear-gradient(100deg, rgba(255, 255, 255, 0.05) 30%, rgba(255, 255, 255, 0.14) 50%, rgba(255, 255, 255, 0.05) 70%);
  background-size: 220% 100%;
}

/* ровные колонки: у всех строк одинаковая ширина зоны действий */
.row {
  grid-template-columns: 34px minmax(0, 1fr) 92px 74px 112px;
}
.as-rows .row-actions {
  width: 112px;
}
.skel-row {
  grid-template-columns: 34px 28px minmax(0, 1fr) 92px 74px 112px;
}

/* индикация активности, когда процент ещё 0 */
.seg {
  position: relative;
}
.seg.busy::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
  background-size: 22% 100%;
  background-repeat: no-repeat;
  animation: netsweep 1.2s linear infinite;
  mix-blend-mode: screen;
}

/* строки очереди не мигают при обновлении прогресса */
.job {
  animation: none;
}

/* сообщения и очередь поднимаются над плеером */
body:has(.player:not([hidden])) #toasts,
body:has(.player:not([hidden])) .dock {
  bottom: 122px;
}

/* видео: свои контролы */
.video-wrap {
  width: min(1100px, 100%);
  aspect-ratio: 16 / 9;
  max-height: calc(100vh - 100px);
  background: #000;
  overflow: hidden;
}
.video-wrap.has-meta {
  aspect-ratio: auto;
  width: auto;
  background: transparent;
}
.video-wrap .stage-media {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  cursor: pointer;
}
.video-wrap.has-meta .stage-media {
  width: auto;
  height: auto;
  max-width: 100%;
}
.video-wrap:fullscreen {
  width: 100vw;
  max-height: none;
  aspect-ratio: auto;
  background: #000;
}
.video-wrap:fullscreen .stage-media {
  width: 100%;
  height: 100%;
  max-height: none;
}
.vc {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 26px 14px 10px;
  background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.3s, transform 0.3s var(--ease);
}
.vc.show {
  opacity: 1;
  transform: none;
}
.vc .icon-btn {
  color: var(--ink);
}
.vc .pl-time {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--mute);
  white-space: nowrap;
}

/* читаемость */
.gate-lead,
.state-text {
  font-weight: 300;
}
.md {
  font-weight: 300;
}


/* --- телефоны: без зума при фокусе и без двойного тапа --- */
html {
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
* {
  -webkit-tap-highlight-color: transparent;
}
button,
a,
input,
textarea,
[role='slider'],
.row,
.seed-cell {
  touch-action: manipulation;
}
/* iOS приближает поле, если шрифт меньше 16px — на сенсорных экранах держим 16px */
@media (hover: none) and (pointer: coarse), (max-width: 760px) {
  input,
  textarea,
  select,
  .seed-input,
  .field,
  .search-field,
  .cover-field,
  .ed-text {
    font-size: 16px !important;
  }
}


/* --- анимации закрытия модалок --- */
.closing {
  pointer-events: none !important;
}
.dlg.closing {
  animation: dlgOut 0.17s ease both !important;
}
@keyframes dlgOut {
  to { opacity: 0; transform: translateY(8px) scale(0.98); filter: blur(3px); }
}
.viewer.closing {
  animation: viewerOut 0.24s ease both !important;
}
@keyframes viewerOut {
  to { opacity: 0; filter: blur(6px); transform: scale(0.985); }
}
.viewer.no-enter {
  animation: none;
}
.editor {
  animation: editorIn 0.32s var(--ease) both;
}
@keyframes editorIn {
  from { opacity: 0; transform: translateY(14px); }
}
.editor.closing {
  animation: editorOut 0.24s ease both !important;
}
@keyframes editorOut {
  to { opacity: 0; transform: translateY(16px); }
}
.player.closing {
  animation: playerOut 0.24s ease both !important;
}
@keyframes playerOut {
  to { opacity: 0; transform: translateY(100%); }
}
.viewer .stage > * {
  animation: rise 0.35s var(--ease) both;
}

/* --- кнопка «назад к папке» --- */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: none;
  max-width: 180px;
  height: 34px;
  padding: 0 10px 0 6px;
  border: 1px solid var(--hair-2);
  background: transparent;
  color: var(--mute);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.back-btn:hover {
  color: var(--ink);
  border-color: var(--ink);
}
.back-ic {
  display: grid;
}
.back-ic svg {
  width: 16px;
  height: 16px;
}
.back-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* --- верх редактора: одна строка на ПК --- */
.ed-top {
  flex-wrap: nowrap;
  min-width: 0;
}
.ed-name {
  min-width: 0;
  flex: 1 1 auto;
}
.ed-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
  min-width: 0;
}
.ed-bar .ed-tabs {
  margin-left: 0;
}
.viewer-top {
  min-width: 0;
}
.viewer-name {
  flex: 0 1 auto;
}

/* --- телефон: редактор и просмотр --- */
@media (max-width: 760px) {
  .ed-top {
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px 10px;
  }
  .ed-kind,
  .ed-count,
  .ed-x,
  .viewer-kind,
  .viewer-x {
    display: none !important;
  }
  .back-btn {
    max-width: 42vw;
    height: 36px;
  }
  .ed-name {
    flex: 1 1 0;
    font-size: 15px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ed-bar {
    order: 5;
    flex: 1 1 100%;
    margin-left: 0;
    justify-content: space-between;
    gap: 8px;
  }
  .ed-status {
    min-width: 0;
    flex: 1;
    justify-content: flex-start;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ed-tab {
    height: 32px;
    padding: 0 10px;
  }
  .ed-save {
    flex: none;
  }
  /* текст: компактный узкий шрифт, 16px чтобы iOS не приближал */
  .ed-text {
    padding: 14px 14px 40vh;
    font-family: var(--display);
    font-weight: 300;
    line-height: 1.5;
    letter-spacing: 0.005em;
  }
  .ed-preview {
    padding: 16px 14px 30vh;
  }
  .skel-text {
    padding: 18px 14px;
  }
  .md {
    font-size: 16px;
    line-height: 1.55;
    overflow-wrap: anywhere;
  }
  .md h1 { font-size: 26px; }
  .md h2 { font-size: 21px; }
  .md h3 { font-size: 18px; }
  .md pre {
    white-space: pre-wrap;
    word-break: break-word;
  }
  .md table {
    display: block;
    overflow-x: auto;
  }
  .md img {
    height: auto;
  }

  .viewer-top {
    gap: 8px;
    padding: 8px 8px 8px 10px;
  }
  .viewer-name {
    flex: 1 1 0;
    font-size: 15px;
  }
  .viewer-meta {
    display: none;
  }
  .viewer-nav {
    width: 36px;
    height: 52px;
    margin-top: -26px;
    background: rgba(5, 5, 6, 0.55);
  }
  .stage {
    padding: 0 6px 8px;
  }
  .decrypt-panel {
    padding: 18px 16px 14px;
  }
  .vc {
    gap: 4px;
    padding: 22px 6px 6px;
  }
  .vc .pl-time {
    font-size: 10px;
  }
}


/* =====================================================================
   КИБЕРПАНК-ПОЯВЛЕНИЕ И ЗАКРЫТИЕ МОДАЛОК
   ===================================================================== */

/* просмотр: включение ЭЛТ-экрана — вспышка-линия раскрывается в кадр */
.viewer {
  animation: crtOn 0.52s cubic-bezier(0.2, 0.8, 0.2, 1) both !important;
  transform-origin: 50% 50%;
}
.viewer.no-enter {
  animation: none !important;
}
@keyframes crtOn {
  0% { opacity: 1; transform: scale(0.3, 0.004); filter: brightness(6) contrast(2); }
  32% { transform: scale(1, 0.004); filter: brightness(4); }
  62% { transform: scale(1, 1.02); filter: brightness(1.6) contrast(1.2); }
  76% { transform: scale(1, 0.995); filter: brightness(1.15); }
  100% { opacity: 1; transform: none; filter: none; }
}
.viewer.closing {
  animation: crtOff 0.34s cubic-bezier(0.6, 0, 0.8, 0.4) both !important;
}
@keyframes crtOff {
  0% { transform: none; filter: none; opacity: 1; }
  55% { transform: scale(1, 0.006); filter: brightness(4); opacity: 1; }
  100% { transform: scale(0, 0.006); filter: brightness(6); opacity: 0; }
}
/* строка развёртки, пробегающая по кадру сразу после включения */
.viewer::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 2px;
  pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
  box-shadow: 0 0 18px 2px rgba(255, 255, 255, 0.35);
  opacity: 0;
  animation: rasterOnce 0.9s 0.35s ease-out both;
}
.viewer.no-enter::after,
.editor.closing::after,
.viewer.closing::after {
  animation: none;
}
@keyframes rasterOnce {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(100vh); }
}

/* редактор: глитч-нарезка — кадр проявляется полосами со сдвигом */
.editor {
  animation: sliceIn 0.5s steps(1, end) both, editorRise 0.5s var(--ease) both !important;
}
@keyframes sliceIn {
  0% { clip-path: inset(0 0 92% 0); }
  12% { clip-path: inset(18% 0 60% 0); }
  24% { clip-path: inset(0 0 48% 0); }
  36% { clip-path: inset(40% 0 22% 0); }
  48% { clip-path: inset(0 0 26% 0); }
  60% { clip-path: inset(0 0 9% 0); }
  72% { clip-path: inset(0 0 2% 0); }
  84%, 100% { clip-path: inset(0); }
}
@keyframes editorRise {
  0% { opacity: 0.6; transform: translateX(-10px); filter: brightness(1.9) contrast(1.3); }
  20% { transform: translateX(8px); }
  40% { transform: translateX(-5px); filter: brightness(1.4); }
  60% { transform: translateX(3px); }
  100% { opacity: 1; transform: none; filter: none; }
}
.editor::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 3px);
  opacity: 0;
  animation: scanFade 0.7s ease-out both;
}
@keyframes scanFade {
  0% { opacity: 1; }
  100% { opacity: 0; }
}
.editor.closing {
  animation: sliceOut 0.3s steps(1, end) both, editorDrop 0.3s ease-in both !important;
}
@keyframes sliceOut {
  0% { clip-path: inset(0); }
  25% { clip-path: inset(0 0 30% 0); }
  50% { clip-path: inset(30% 0 30% 0); }
  75% { clip-path: inset(48% 0 48% 0); }
  100% { clip-path: inset(50% 0 50% 0); }
}
@keyframes editorDrop {
  0% { filter: none; transform: none; }
  40% { transform: translateX(6px); filter: brightness(1.6); }
  100% { transform: translateX(-4px); filter: brightness(2.5); opacity: 0; }
}

/* диалог: HUD-рамка собирается из центра, мерцает и встаёт */
.dlg[open] {
  animation: hudIn 0.46s cubic-bezier(0.2, 0.8, 0.2, 1) both !important;
}
@keyframes hudIn {
  0% { opacity: 0; transform: scale(1.06); clip-path: inset(48% 0 48% 0); filter: brightness(3); }
  35% { opacity: 1; clip-path: inset(0 0 0 0); transform: scale(1); filter: brightness(1.8); }
  45% { opacity: 0.35; }
  55% { opacity: 1; }
  65% { opacity: 0.6; filter: brightness(1.3); }
  100% { opacity: 1; filter: none; transform: none; }
}
.dlg[open]::before,
.dlg[open]::after {
  animation: cornerIn 0.5s 0.15s var(--ease) both;
}
@keyframes cornerIn {
  0% { width: 0; height: 0; opacity: 0; }
  40% { width: 40px; height: 40px; opacity: 1; }
  100% { width: 12px; height: 12px; opacity: 0.75; }
}
.dlg[open] > form > * {
  animation: lineIn 0.35s var(--ease) both;
}
.dlg[open] > form > *:nth-child(2) { animation-delay: 0.08s; }
.dlg[open] > form > *:nth-child(3) { animation-delay: 0.14s; }
.dlg[open] > form > *:nth-child(4) { animation-delay: 0.2s; }
.dlg.closing {
  animation: hudOut 0.2s ease-in both !important;
}
@keyframes hudOut {
  0% { opacity: 1; clip-path: inset(0); filter: none; }
  40% { opacity: 0.4; filter: brightness(2); }
  100% { opacity: 0; clip-path: inset(48% 0 48% 0); transform: scale(0.98); filter: brightness(3); }
}
.dlg::backdrop {
  animation: fadeIn 0.3s ease both;
}

/* плеер: выезжает снизу со вспышкой */
.player:not([hidden]) {
  animation: playerIn 0.45s var(--ease) both;
}
@keyframes playerIn {
  0% { transform: translateY(100%); opacity: 0; filter: brightness(2.5); }
  60% { filter: brightness(1.3); }
  100% { transform: none; opacity: 1; filter: none; }
}

/* очередь загрузок появляется так же, как диалоги */
.dock:not([hidden]) {
  animation: hudIn 0.42s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

/* ---------- адаптив ---------- */

@media (max-width: 760px) {
  body {
    font-size: 16px;
  }
  .gate-wrap {
    padding-top: 7vh;
  }
  .shell {
    padding: 0 14px 130px;
  }
  .tools .search {
    order: 5;
    width: 100%;
  }
  .tools .search-field {
    width: 100%;
  }
  .row {
    grid-template-columns: 30px minmax(0, 1fr) auto auto;
  }
  .skel-row {
    grid-template-columns: 30px 24px minmax(0, 1fr) 54px;
  }
  .skel-meta2 {
    display: none;
  }
  .statusbar .st-cell:nth-child(4) {
    display: none;
  }
  .row-date {
    display: none;
  }
  .crumbs {
    font-size: 20px;
  }
  .brand {
    display: none;
  }
}
@media (max-width: 460px) {
  .seed-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
  ::view-transition-old(root),
  ::view-transition-new(root) {
    animation: none !important;
  }
}
