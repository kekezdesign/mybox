:root {
  color-scheme: dark;
  --bg: #080809;
  --panel: #0f0f11;
  --panel-2: #141417;
  --line: #26262b;
  --line-2: #34343b;
  --ink: #ededf0;
  --mute: #86868f;
  --dim: #5a5a63;
  --inv-bg: #ededf0;
  --inv-ink: #080809;
  --danger: #ff5b52;
  --display: 'Fira Sans Extra Condensed', 'Golos Text Variable', system-ui, sans-serif;
  --mono: 'JetBrains Mono Variable', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --rad: 2px;
}

* ,
*::before,
*::after {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--display);
  font-size: 17px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
/* тонкая сетка-«скан» на фоне */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 44px 44px;
  opacity: 0.12;
  z-index: 0;
}
#app {
  position: relative;
  z-index: 1;
  min-height: 100%;
}
button,
input,
textarea {
  font: inherit;
  color: inherit;
}
/* свои скроллбары вместо системных */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--line-2) transparent;
}
::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--line-2);
  border: 2px solid var(--bg);
}
::-webkit-scrollbar-thumb:hover {
  background: var(--mute);
}
[hidden] {
  display: none !important;
}
:focus-visible {
  outline: 1px solid var(--ink);
  outline-offset: 2px;
}
.mono {
  font-family: var(--mono);
}

/* ---------- кнопки / поля ---------- */

.btn {
  height: 42px;
  padding: 0 18px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: transparent;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color 0.12s, background 0.12s, color 0.12s;
}
.btn:hover {
  border-color: var(--ink);
}
.btn:disabled {
  opacity: 0.45;
  cursor: default;
}
.btn-primary {
  background: var(--inv-bg);
  border-color: var(--inv-bg);
  color: var(--inv-ink);
}
.btn-primary:hover {
  background: #fff;
  border-color: #fff;
}
.btn-danger {
  border-color: var(--danger);
  color: var(--danger);
}
.btn-danger:hover {
  background: var(--danger);
  color: #080809;
}
.btn-big {
  height: 54px;
  padding: 0 32px;
  font-size: 14px;
}
.btn-line {
  height: 32px;
  padding: 0 12px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: transparent;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
}
.btn-line:hover {
  border-color: var(--ink);
}
.btn-line-danger {
  border-color: var(--danger);
  color: var(--danger);
}
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 38px;
  height: 38px;
  flex: none;
  border: 1px solid transparent;
  border-radius: var(--rad);
  background: transparent;
  color: var(--mute);
  cursor: pointer;
  transition: color 0.12s, border-color 0.12s;
}
.icon-btn:hover {
  color: var(--ink);
  border-color: var(--line-2);
}
.link {
  padding: 0;
  border: 0;
  background: none;
  color: var(--mute);
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.04em;
  text-decoration: none;
  border-bottom: 1px solid var(--line-2);
  cursor: pointer;
}
.link:hover {
  color: var(--ink);
  border-color: var(--ink);
}
.field {
  width: 100%;
  height: 46px;
  padding: 0 14px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: var(--panel);
  font-family: var(--mono);
  font-size: 14px;
}
.field:focus {
  outline: none;
  border-color: var(--ink);
}
.label {
  display: grid;
  gap: 7px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--mute);
}
.form-error {
  min-height: 22px;
  margin: 0;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--danger);
}

/* ---------- загрузчик-скан ---------- */

.scanner {
  display: inline-block;
  width: 56px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--ink), transparent);
  background-size: 50% 100%;
  background-repeat: no-repeat;
  animation: scan 1.1s linear infinite;
}
.scanner-lg {
  width: 120px;
  height: 3px;
}
@keyframes scan {
  0% {
    background-position: -60% 0;
  }
  100% {
    background-position: 160% 0;
  }
}

/* ---------- обложка ---------- */

.cover {
  display: grid;
  place-items: center;
  min-height: 100vh;
  padding: 24px 16px;
}
.cover-wrap {
  width: min(560px, 100%);
  text-align: center;
}
.cover-top {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--mute);
  font-family: var(--mono);
  letter-spacing: 0.4em;
  font-size: 12px;
}
.cover-mark {
  animation: blink 1.4s steps(1) infinite;
}
@keyframes blink {
  50% {
    opacity: 0.25;
  }
}
.cover-clock {
  margin: 20px 0 14px;
  font-family: var(--mono);
  font-size: clamp(52px, 15vw, 108px);
  font-weight: 300;
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
}
.cover-tag {
  max-width: 34em;
  margin: 0 auto 32px;
  color: var(--mute);
  font-size: 18px;
}
.cover-cmd {
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 360px;
  margin: 0 auto;
  padding: 0 14px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: var(--panel);
}
.cover-prompt {
  font-family: var(--mono);
  color: var(--dim);
}
.cover-field {
  flex: 1;
  height: 46px;
  border: 0;
  background: none;
  font-family: var(--mono);
  font-size: 14px;
}
.cover-field:focus {
  outline: none;
}
.cover-foot {
  margin-top: 20px;
  color: var(--dim);
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.1em;
}

/* ---------- экран входа / настройки ---------- */

.gate {
  min-height: 100vh;
}
.gate-wrap {
  position: relative;
  max-width: 640px;
  margin: 0 auto;
  padding: 10vh 20px 60px;
}
.ghost-x {
  position: absolute;
  top: 22px;
  right: 16px;
}
.gate-head {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  margin-bottom: 12px;
}
.gate-eyebrow {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.3em;
  color: var(--dim);
}
.gate-title {
  margin: 0;
  font-size: clamp(42px, 9vw, 76px);
  font-weight: 300;
  line-height: 0.98;
  letter-spacing: 0.01em;
}
.gate-lead {
  max-width: 40em;
  margin: 0 0 30px;
  color: var(--mute);
  font-size: 18px;
}
.gate-note {
  margin: -18px 0 24px;
  color: var(--dim);
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.6;
}
.gate-form {
  display: grid;
  gap: 16px;
}
.gate-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin-top: 8px;
}
.gate-foot {
  margin-top: 36px;
}
.setup-list {
  margin: 0 0 26px;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 12px;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--mute);
}
.setup-list li {
  padding-left: 16px;
  border-left: 1px solid var(--line-2);
  line-height: 1.7;
}
.setup-list b {
  color: var(--ink);
  font-weight: 500;
}
.copyable {
  display: inline-block;
  margin-top: 4px;
  padding: 2px 8px;
  border: 1px dashed var(--line-2);
  border-radius: var(--rad);
  background: var(--panel);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 12px;
  word-break: break-all;
  cursor: copy;
}
.copyable:hover {
  border-color: var(--ink);
}

/* ---------- сетка слов ---------- */

.seed-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.seed-cell {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  height: 46px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: var(--panel);
}
.seed-cell:focus-within {
  border-color: var(--ink);
}
.seed-num {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  min-width: 18px;
}
.seed-input {
  flex: 1;
  min-width: 0;
  height: 100%;
  border: 0;
  background: none;
  font-family: var(--mono);
  font-size: 14px;
}
.seed-input:focus {
  outline: none;
}
.seed-input.bad {
  color: var(--danger);
}
.seed-static {
  background: var(--panel-2);
}
.seed-word {
  font-family: var(--mono);
  font-size: 14px;
}
.seed-top {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 10px;
}
.eye-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 10px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: transparent;
  color: var(--mute);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}
.eye-btn:hover {
  color: var(--ink);
  border-color: var(--ink);
}
.eye-btn svg {
  width: 16px;
  height: 16px;
}

/* свой список подсказок слов (вместо браузерного datalist) */
.seed-cell {
  position: relative;
}
.ac {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  z-index: 12;
  margin: 0;
  padding: 2px;
  list-style: none;
  max-height: 184px;
  overflow: auto;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: var(--panel-2);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
}
.ac-item {
  padding: 7px 10px;
  border-radius: var(--rad);
  font-family: var(--mono);
  font-size: 13px;
  color: var(--mute);
  cursor: pointer;
}
.ac-item:hover,
.ac-item.on {
  background: var(--inv-bg);
  color: var(--inv-ink);
}

/* ---------- менеджер ---------- */

.shell-root {
  min-height: 100vh;
}
.shell {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 20px 120px;
}
.top {
  position: sticky;
  top: 0;
  z-index: 4;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px 20px;
  padding: 16px 0;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line-2);
}
.top-left {
  display: flex;
  align-items: baseline;
  gap: 16px;
  min-width: 0;
}
.brand {
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.3em;
  color: var(--dim);
  text-transform: uppercase;
}
.crumbs {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px 8px;
  min-width: 0;
  font-size: 24px;
  font-weight: 300;
}
.crumb {
  padding: 0;
  border: 0;
  background: none;
  color: var(--mute);
  cursor: pointer;
  overflow-wrap: anywhere;
  text-align: left;
}
button.crumb:hover {
  color: var(--ink);
}
.crumb.drop-into,
.crumb:hover {
  color: var(--ink);
}
.crumb-here {
  color: var(--ink);
  cursor: default;
}
.crumb-sep {
  color: var(--dim);
}
.tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}
.search {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 38px;
  padding: 0 10px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: var(--panel);
}
.search:focus-within {
  border-color: var(--ink);
}
.search-ic {
  color: var(--dim);
  display: grid;
}
.search-field {
  width: 150px;
  height: 100%;
  border: 0;
  background: none;
  font-family: var(--mono);
  font-size: 13px;
}
.search-field:focus {
  outline: none;
}

.selbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 13px;
}
.sel-count {
  color: var(--mute);
  letter-spacing: 0.06em;
}

.list {
  padding-top: 4px;
}
.row {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) 92px 70px auto;
  align-items: center;
  border-bottom: 1px solid var(--line);
}
.row:hover {
  background: var(--panel);
}
.row-sel {
  background: var(--panel-2);
}
.row.drop-into {
  outline: 1px dashed var(--ink);
  outline-offset: -1px;
}
.row-check {
  display: grid;
  place-items: center;
  width: 34px;
  height: 54px;
  border: 0;
  background: none;
  cursor: pointer;
}
.check-box {
  width: 15px;
  height: 15px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
}
.check-box.on {
  background: var(--inv-bg);
  border-color: var(--inv-bg);
}
.row:hover .check-box {
  border-color: var(--mute);
}
.row-open {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  height: 54px;
  padding: 0 4px;
  border: 0;
  background: none;
  text-align: left;
  cursor: pointer;
}
.row-open:disabled {
  cursor: default;
}
.row-icon {
  display: grid;
  place-items: center;
  flex: none;
  width: 26px;
  height: 26px;
  color: var(--mute);
  position: relative;
}
.kind-folder {
  color: var(--ink);
}
.row-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 17px;
}
.row-size,
.row-date {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--mute);
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.row-actions {
  display: flex;
  justify-content: flex-end;
  padding-left: 6px;
  opacity: 0;
}
.row:hover .row-actions,
.row:focus-within .row-actions {
  opacity: 1;
}
@media (hover: none) {
  .row-actions {
    opacity: 1;
  }
}
.row-actions .icon-btn {
  width: 34px;
  height: 34px;
}
.row-locked .row-name {
  color: var(--dim);
  font-style: italic;
}

.as-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
  padding-top: 18px;
}
.as-grid .row {
  position: relative;
  display: block;
  border: 1px solid var(--line);
  border-radius: var(--rad);
  background: var(--panel);
  padding: 0;
}
.as-grid .row:hover {
  border-color: var(--line-2);
}
.as-grid .row-check {
  position: absolute;
  top: 4px;
  left: 4px;
  z-index: 2;
  width: 30px;
  height: 30px;
  opacity: 0;
}
.as-grid .row:hover .row-check,
.as-grid .row-sel .row-check {
  opacity: 1;
}
.as-grid .row-open {
  display: grid;
  gap: 0;
  width: 100%;
  height: auto;
  padding: 0;
}
.as-grid .row-icon {
  width: 100%;
  height: auto;
  aspect-ratio: 1;
  border-bottom: 1px solid var(--line);
  background: var(--panel-2);
  overflow: hidden;
}
.as-grid .row-icon svg {
  width: 38px;
  height: 38px;
}
.as-grid .row-icon img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.as-grid .has-thumb svg {
  visibility: hidden;
}
.as-grid .row-name {
  padding: 9px 10px;
  font-size: 14px;
}
.as-grid .row-size,
.as-grid .row-date {
  display: none;
}
.as-grid .row-actions {
  position: absolute;
  top: 4px;
  right: 4px;
  border: 1px solid var(--line);
  border-radius: var(--rad);
  background: var(--panel);
}

.loading {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 60px 0;
  color: var(--mute);
  font-family: var(--mono);
  font-size: 13px;
}
.empty {
  padding: 80px 0;
  color: var(--mute);
}
.empty p {
  margin: 0;
}
.empty-title {
  margin-bottom: 8px !important;
  color: var(--ink);
  font-size: 30px;
  font-weight: 300;
}
.foot {
  padding-top: 20px;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--dim);
}

/* ---------- панель загрузок ---------- */

.dock {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 15;
  width: min(360px, calc(100vw - 36px));
  max-height: 46vh;
  overflow: auto;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: var(--panel);
}
.dock-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 42px;
  padding: 4px 6px 4px 14px;
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--mute);
}
.job {
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
}
.job:last-child {
  border-bottom: 0;
}
.job-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 26px;
}
.job-row .icon-btn {
  width: 26px;
  height: 26px;
}
.job-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 15px;
}
.job-status {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--mute);
}
.job-error .job-status {
  color: var(--danger);
}
.bar {
  height: 2px;
  margin: 6px 0;
  background: var(--line-2);
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  background: var(--ink);
  transition: width 0.2s;
}

.drop {
  position: fixed;
  inset: 10px;
  z-index: 20;
  display: grid;
  place-items: center;
  border: 1px dashed var(--ink);
  border-radius: var(--rad);
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  font-family: var(--mono);
  font-size: 16px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  pointer-events: none;
}

/* ---------- окна / сообщения ---------- */

.dlg {
  width: min(440px, calc(100vw - 32px));
  padding: 24px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: var(--panel);
  color: var(--ink);
}
.dlg::backdrop {
  background: rgba(0, 0, 0, 0.7);
}
.dlg h2 {
  margin: 0 0 8px;
  font-size: 26px;
  font-weight: 300;
}
.dlg p {
  margin: 0 0 14px;
  color: var(--mute);
}
.dlg-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
}
#toasts {
  position: fixed;
  left: 18px;
  bottom: 18px;
  z-index: 40;
  display: grid;
  gap: 8px;
  width: min(440px, calc(100vw - 36px));
}
.toast {
  padding: 12px 14px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: var(--panel-2);
  font-family: var(--mono);
  font-size: 13px;
  overflow-wrap: anywhere;
}
.toast-error {
  border-color: var(--danger);
  color: var(--danger);
}

/* ---------- просмотр ---------- */

.viewer {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  background: #050506;
}
.viewer-top {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px 10px 18px;
  border-bottom: 1px solid var(--line);
}
.viewer-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.viewer-meta {
  flex: 1;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--mute);
  white-space: nowrap;
}
.viewer-extra {
  display: flex;
}
.stage {
  display: grid;
  place-items: center;
  min-height: 0;
  padding: 0 14px 14px;
}
.stage-note {
  max-width: 32em;
  text-align: center;
  color: var(--mute);
  font-family: var(--mono);
  font-size: 13px;
}
.stage-img,
.stage-media {
  max-width: 100%;
  max-height: 100%;
  min-height: 0;
  object-fit: contain;
}
.stage-frame {
  width: 100%;
  height: 100%;
  border: 0;
  background: #fff;
  border-radius: var(--rad);
}
.viewer-nav {
  position: absolute;
  top: 50%;
  display: grid;
  place-items: center;
  width: 42px;
  height: 64px;
  margin-top: -32px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: rgba(8, 8, 9, 0.7);
  color: var(--ink);
  cursor: pointer;
}
.viewer-nav:hover {
  border-color: var(--ink);
}
.viewer-prev {
  left: 10px;
}
.viewer-next {
  right: 10px;
}
.hidden-frame {
  position: absolute;
  width: 0;
  height: 0;
  border: 0;
  visibility: hidden;
}

/* ---------- редактор ---------- */

.editor {
  position: fixed;
  inset: 0;
  z-index: 32;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  background: var(--bg);
}
.ed-top {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px 10px 18px;
  border-bottom: 1px solid var(--line-2);
}
.ed-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 18px;
}
.ed-tabs {
  display: flex;
  gap: 4px;
  margin-left: auto;
}
.ed-tab {
  height: 30px;
  padding: 0 12px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: none;
  color: var(--mute);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}
.ed-tab.on {
  color: var(--inv-ink);
  background: var(--inv-bg);
  border-color: var(--inv-bg);
}
.ed-status {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--mute);
  min-width: 90px;
  text-align: right;
}
.ed-stage {
  min-height: 0;
  display: grid;
}
.ed-text {
  width: 100%;
  height: 100%;
  padding: 24px clamp(16px, 8vw, 120px);
  border: 0;
  background: var(--bg);
  resize: none;
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.7;
}
.ed-text:focus {
  outline: none;
}
.ed-preview {
  overflow: auto;
  padding: 24px clamp(16px, 8vw, 120px);
}

.md {
  font-size: 16px;
  line-height: 1.7;
}
.md h1,
.md h2,
.md h3 {
  font-weight: 400;
  line-height: 1.2;
  margin: 1.4em 0 0.5em;
}
.md h1 {
  font-size: 34px;
}
.md h2 {
  font-size: 26px;
}
.md h3 {
  font-size: 20px;
}
.md a {
  color: var(--ink);
}
.md code {
  font-family: var(--mono);
  font-size: 0.88em;
  padding: 1px 5px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
}
.md pre {
  padding: 14px 16px;
  border: 1px solid var(--line-2);
  border-radius: var(--rad);
  background: var(--panel);
  overflow: auto;
}
.md pre code {
  border: 0;
  padding: 0;
}
.md blockquote {
  margin: 1em 0;
  padding-left: 16px;
  border-left: 2px solid var(--line-2);
  color: var(--mute);
}
.md table {
  border-collapse: collapse;
}
.md th,
.md td {
  border: 1px solid var(--line-2);
  padding: 6px 10px;
}
.md img {
  max-width: 100%;
}

/* ---------- плеер ---------- */

.player {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 18;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 16px;
  border-top: 1px solid var(--line-2);
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  backdrop-filter: blur(10px);
}
.pl-ic {
  display: grid;
  color: var(--mute);
  flex: none;
}
.pl-main {
  flex: 1;
  min-width: 0;
}
.pl-title {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 15px;
}
.pl-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
}
.pl-controls .icon-btn {
  width: 32px;
  height: 32px;
}
.pl-time {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--mute);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.pl-seek {
  flex: 1;
  min-width: 60px;
  height: 2px;
  -webkit-appearance: none;
  appearance: none;
  background: var(--line-2);
  cursor: pointer;
}
.pl-seek::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--ink);
}
.pl-seek::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border: 0;
  border-radius: 50%;
  background: var(--ink);
}

/* ---------- анимации ---------- */

.cover-wrap {
  animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.cover-clock {
  animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both, flicker 6s steps(1) 1s infinite;
}
@keyframes flicker {
  0%, 97%, 100% { opacity: 1; }
  97.5% { opacity: 0.35; }
  98% { opacity: 1; }
  98.5% { opacity: 0.55; }
}
/* бегущая строка-скан по обложке */
.cover::after {
  content: '';
  position: fixed;
  left: 0;
  right: 0;
  top: 0;
  height: 140px;
  pointer-events: none;
  z-index: 0;
  background: linear-gradient(to bottom, transparent, rgba(237, 237, 240, 0.05), transparent);
  animation: sweep 7s linear infinite;
}
@keyframes sweep {
  from { transform: translateY(-140px); }
  to { transform: translateY(100vh); }
}

@keyframes rise {
  from { opacity: 0; transform: translateY(12px); }
}

/* появление панели входа/настройки и ячеек по очереди */
.gate-enter {
  animation: rise 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.gate-enter .seed-cell {
  animation: cellIn 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
@keyframes cellIn {
  from { opacity: 0; transform: translateY(8px); }
}
.gate-enter .seed-cell:nth-child(1) { animation-delay: 0.04s; }
.gate-enter .seed-cell:nth-child(2) { animation-delay: 0.08s; }
.gate-enter .seed-cell:nth-child(3) { animation-delay: 0.12s; }
.gate-enter .seed-cell:nth-child(4) { animation-delay: 0.16s; }
.gate-enter .seed-cell:nth-child(5) { animation-delay: 0.2s; }
.gate-enter .seed-cell:nth-child(6) { animation-delay: 0.24s; }
.gate-enter .seed-cell:nth-child(7) { animation-delay: 0.28s; }
.gate-enter .seed-cell:nth-child(8) { animation-delay: 0.32s; }
.gate-enter .seed-cell:nth-child(9) { animation-delay: 0.36s; }
.gate-enter .seed-cell:nth-child(10) { animation-delay: 0.4s; }
.gate-enter .seed-cell:nth-child(11) { animation-delay: 0.44s; }
.gate-enter .seed-cell:nth-child(12) { animation-delay: 0.48s; }

.seed-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 2px;
}
.seed-hint {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--mute);
}

/* глитч заголовка — монохромный, редкими всплесками */
.glitch {
  position: relative;
}
.glitch::before,
.glitch::after {
  content: attr(data-text);
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  overflow: hidden;
  pointer-events: none;
}
.glitch::before {
  color: #fff;
  opacity: 0.55;
  animation: glitchTop 5s steps(2) infinite;
}
.glitch::after {
  color: var(--mute);
  animation: glitchBottom 5s steps(2) infinite;
}
@keyframes glitchTop {
  0%, 92%, 100% { transform: none; clip-path: inset(0 0 100% 0); opacity: 0; }
  93% { transform: translate(-3px, -1px); clip-path: inset(0 0 55% 0); opacity: 0.6; }
  95% { transform: translate(3px, 1px); clip-path: inset(0 0 60% 0); opacity: 0.6; }
  97% { transform: translate(-2px, 0); clip-path: inset(0 0 50% 0); opacity: 0.6; }
}
@keyframes glitchBottom {
  0%, 92%, 100% { transform: none; clip-path: inset(100% 0 0 0); opacity: 0; }
  93.5% { transform: translate(3px, 1px); clip-path: inset(55% 0 0 0); opacity: 0.5; }
  95.5% { transform: translate(-3px, -1px); clip-path: inset(60% 0 0 0); opacity: 0.5; }
  97.5% { transform: translate(2px, 0); clip-path: inset(50% 0 0 0); opacity: 0.5; }
}

/* луч-скан во время расшифровки */
.decrypting::before {
  content: '';
  position: fixed;
  left: 0;
  right: 0;
  height: 2px;
  top: 0;
  z-index: 50;
  background: linear-gradient(90deg, transparent, var(--ink), transparent);
  box-shadow: 0 0 12px 1px rgba(237, 237, 240, 0.4);
  animation: decryptScan 1s linear infinite;
}
@keyframes decryptScan {
  from { transform: translateY(0); }
  to { transform: translateY(100vh); }
}

/* наведение на строки/кнопки — мягкое */
.row,
.btn,
.btn-line,
.icon-btn,
.seed-cell {
  transition: background 0.14s, border-color 0.14s, color 0.14s, transform 0.14s;
}
.as-grid .row:hover {
  transform: translateY(-2px);
}

/* ---------- адаптив ---------- */

@media (max-width: 760px) {
  body {
    font-size: 16px;
  }
  .gate-wrap {
    padding-top: 7vh;
  }
  .shell {
    padding: 0 14px 130px;
  }
  .tools .search {
    order: 5;
    width: 100%;
  }
  .tools .search-field {
    width: 100%;
  }
  .row {
    grid-template-columns: 30px minmax(0, 1fr) auto auto;
  }
  .row-date {
    display: none;
  }
  .crumbs {
    font-size: 20px;
  }
  .brand {
    display: none;
  }
}
@media (max-width: 460px) {
  .seed-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  .scanner,
  .cover-mark {
    animation: none !important;
    transition: none !important;
  }
}
</style>
