:root {
  --steel: #dfe4e8;
  --plate: #f5f7f8;
  --ink: #17212b;
  --mute: #5a6773;
  --line: #c2cad1;
  --brass: #8f6418;
  --brass-soft: #e9dcc0;
  --alarm: #b3261e;
  --radius: 6px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --steel: #1a2129;
    --plate: #232c36;
    --ink: #e7ebee;
    --mute: #97a3ae;
    --line: #36434f;
    --brass: #d6a655;
    --brass-soft: #4a3d24;
    --alarm: #f2857d;
  }
}

*,
*::before,
*::after {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
}
body {
  margin: 0;
  background: var(--steel);
  color: var(--ink);
  font: 400 16px/1.5 'Golos Text Variable', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
button,
input {
  font: inherit;
  color: inherit;
}
[hidden] {
  display: none !important;
}
:focus-visible {
  outline: 2px solid var(--brass);
  outline-offset: 2px;
}

/* ---------- кнопки и поля ---------- */

.btn {
  height: 40px;
  padding: 0 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--plate);
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover {
  border-color: var(--mute);
}
.btn:disabled {
  opacity: 0.6;
  cursor: default;
}
.btn-primary {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--steel);
}
.btn-danger {
  background: var(--alarm);
  border-color: var(--alarm);
  color: #fff;
}
@media (prefers-color-scheme: dark) {
  .btn-danger {
    color: #1a2129;
  }
}
.btn-big {
  height: 52px;
  padding: 0 28px;
  font-size: 18px;
}
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 36px;
  height: 36px;
  flex: none;
  border: 0;
  border-radius: var(--radius);
  background: none;
  color: var(--mute);
  cursor: pointer;
}
.icon-btn:hover {
  color: var(--ink);
  background: color-mix(in srgb, var(--ink) 8%, transparent);
}
.link {
  padding: 0;
  border: 0;
  background: none;
  color: var(--ink);
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}
.field {
  width: 100%;
  height: 44px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--plate);
}
.field:focus {
  outline: 2px solid var(--brass);
  outline-offset: 0;
  border-color: var(--brass);
}
.label {
  display: grid;
  gap: 6px;
  font-size: 14px;
  color: var(--mute);
}
.form-error {
  min-height: 24px;
  margin: 0;
  color: var(--alarm);
  font-weight: 500;
}

/* ---------- вход ---------- */

.gate {
  min-height: 100%;
  max-width: 620px;
  margin: 0 auto 0 max(16px, 11vw);
  padding: 14vh 16px 48px 0;
}
.gate h1 {
  margin: 0 0 12px;
  font-size: clamp(40px, 7vw, 68px);
  line-height: 1.02;
  font-weight: 600;
  letter-spacing: -0.03em;
}
.lead {
  max-width: 34em;
  margin: 0 0 36px;
  color: var(--mute);
  font-size: 18px;
}
.gate-form {
  display: grid;
  gap: 14px;
}
.phrase-wrap {
  position: relative;
}
.phrase {
  height: 68px;
  padding: 0 56px 0 20px;
  font-size: 22px;
  border-width: 2px;
  border-color: var(--ink);
}
.phrase-eye {
  position: absolute;
  top: 16px;
  right: 12px;
}
.notch-row {
  display: flex;
  align-items: center;
  gap: 14px;
  color: var(--mute);
  font-size: 14px;
}
.notches {
  display: flex;
  gap: 5px;
}
.notches i {
  width: 22px;
  height: 8px;
  border: 1px solid var(--mute);
  border-radius: 2px;
  transition: background-color 0.15s;
}
.notches i.on {
  background: var(--brass);
  border-color: var(--brass);
}
.gate-actions {
  display: flex;
  gap: 12px;
  margin-top: 6px;
}
.gate-foot {
  margin-top: 44px;
  color: var(--mute);
  font-size: 14px;
}
.steps {
  margin: 0 0 32px;
  padding-left: 22px;
  display: grid;
  gap: 10px;
}
.steps li::marker {
  color: var(--brass);
  font-weight: 600;
}
.copyable {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 8px;
  border: 1px dashed var(--brass);
  border-radius: 4px;
  background: var(--brass-soft);
  font: inherit;
  font-weight: 500;
  cursor: copy;
  word-break: break-all;
}

/* ---------- основной экран ---------- */

.shell {
  max-width: 1120px;
  min-height: 100%;
  margin: 0 auto;
  padding: 0 24px 96px;
}
.top {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px 24px;
  padding: 20px 0 16px;
  background: var(--steel);
  border-bottom: 2px solid var(--ink);
}
.crumbs {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px 8px;
  min-width: 0;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.crumb {
  padding: 0;
  border: 0;
  background: none;
  color: var(--mute);
  font-weight: 500;
  cursor: pointer;
  overflow-wrap: anywhere;
  text-align: left;
}
button.crumb:hover {
  color: var(--ink);
  text-decoration: underline;
  text-underline-offset: 4px;
}
.crumb-here {
  color: var(--ink);
  font-weight: 600;
  cursor: default;
}
.crumb-sep {
  color: var(--line);
}
.tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 96px 104px 76px;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--line);
}
.row:hover {
  background: color-mix(in srgb, var(--plate) 70%, transparent);
}
.row-open {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  height: 52px;
  padding: 0 4px;
  border: 0;
  background: none;
  text-align: left;
  cursor: pointer;
}
.row-open:disabled {
  cursor: default;
}
.row-icon {
  position: relative;
  display: grid;
  place-items: center;
  flex: none;
  width: 28px;
  height: 28px;
  color: var(--mute);
}
.kind-folder {
  color: var(--brass);
}
.row-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.row-size,
.row-date {
  color: var(--mute);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  text-align: right;
  white-space: nowrap;
}
.row-actions {
  display: flex;
  justify-content: flex-end;
}
.row-locked .row-name {
  color: var(--mute);
  font-style: italic;
}

.as-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 16px;
  padding-top: 20px;
}
.as-grid .row {
  position: relative;
  display: block;
  border: 0;
  background: none;
}
.as-grid .row-open {
  display: grid;
  gap: 8px;
  width: 100%;
  height: auto;
  padding: 0;
}
.as-grid .row-icon {
  width: 100%;
  height: auto;
  aspect-ratio: 1;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--plate);
  overflow: hidden;
}
.as-grid .row-icon svg {
  width: 40px;
  height: 40px;
}
.as-grid .row-icon img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.as-grid .has-thumb svg {
  visibility: hidden;
}
.as-grid .row-name {
  font-size: 14px;
}
.as-grid .row-size,
.as-grid .row-date {
  display: none;
}
.as-grid .row-actions {
  position: absolute;
  top: 6px;
  right: 6px;
  border-radius: var(--radius);
  background: var(--plate);
  opacity: 0;
}
.as-grid .row:hover .row-actions,
.as-grid .row:focus-within .row-actions {
  opacity: 1;
}
@media (hover: none) {
  .as-grid .row-actions {
    opacity: 1;
  }
}

.empty {
  grid-column: 1 / -1;
  padding: 72px 0;
  color: var(--mute);
}
.empty p {
  margin: 0;
}
.empty-title {
  margin-bottom: 6px !important;
  color: var(--ink);
  font-size: 22px;
  font-weight: 600;
}
.foot {
  padding-top: 20px;
  color: var(--mute);
  font-size: 14px;
}

/* ---------- панель загрузок ---------- */

.dock {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 5;
  width: min(360px, calc(100vw - 40px));
  max-height: 50vh;
  overflow: auto;
  border: 1px solid var(--ink);
  border-radius: var(--radius);
  background: var(--plate);
}
.dock-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 44px;
  padding: 4px 6px 4px 14px;
  border-bottom: 1px solid var(--line);
  font-weight: 600;
}
.job {
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
}
.job:last-child {
  border-bottom: 0;
}
.job-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 28px;
}
.job-row .icon-btn {
  width: 28px;
  height: 28px;
}
.job-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.job-status {
  color: var(--mute);
  font-size: 13px;
}
.job-error .job-status {
  color: var(--alarm);
}
.bar {
  height: 4px;
  margin: 4px 0 6px;
  border-radius: 2px;
  background: var(--line);
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  background: var(--brass);
  transition: width 0.2s;
}

.drop {
  position: fixed;
  inset: 12px;
  z-index: 8;
  display: grid;
  place-items: center;
  border: 3px dashed var(--brass);
  border-radius: 12px;
  background: color-mix(in srgb, var(--steel) 92%, transparent);
  font-size: 22px;
  font-weight: 600;
  text-align: center;
  pointer-events: none;
}

/* ---------- окна и сообщения ---------- */

.dlg {
  width: min(440px, calc(100vw - 32px));
  padding: 24px;
  border: 1px solid var(--ink);
  border-radius: var(--radius);
  background: var(--plate);
  color: var(--ink);
}
.dlg::backdrop {
  background: rgba(10, 16, 22, 0.55);
}
.dlg h2 {
  margin: 0 0 8px;
  font-size: 22px;
  font-weight: 600;
}
.dlg p {
  margin: 0 0 16px;
  color: var(--mute);
}
.dlg-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 20px;
}
#toasts {
  position: fixed;
  left: 20px;
  bottom: 20px;
  z-index: 30;
  display: grid;
  gap: 8px;
  width: min(420px, calc(100vw - 40px));
}
.toast {
  padding: 12px 14px;
  border-radius: var(--radius);
  background: var(--ink);
  color: var(--steel);
  overflow-wrap: anywhere;
}
.toast-error {
  background: var(--alarm);
  color: #fff;
}
@media (prefers-color-scheme: dark) {
  .toast-error {
    color: #1a2129;
  }
}

/* ---------- просмотр ---------- */

.viewer {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  background: #0e1318;
  color: #e7ebee;
}
.viewer-top {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px 10px 20px;
}
.viewer-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 600;
}
.viewer-meta {
  flex: 1;
  color: #97a3ae;
  font-size: 14px;
  white-space: nowrap;
}
.viewer-extra {
  display: flex;
}
.viewer .icon-btn {
  color: #c9d1d8;
}
.viewer .icon-btn:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.12);
}
.stage {
  display: grid;
  place-items: center;
  min-height: 0;
  padding: 0 16px 16px;
}
.stage-note {
  max-width: 32em;
  color: #97a3ae;
  text-align: center;
}
.stage-img,
.stage-media {
  max-width: 100%;
  max-height: 100%;
  min-height: 0;
  object-fit: contain;
}
audio.stage-media {
  width: min(560px, 100%);
}
.stage-frame {
  width: 100%;
  height: 100%;
  border: 0;
  background: #fff;
}
.stage-text {
  align-self: stretch;
  justify-self: stretch;
  margin: 0;
  padding: 20px;
  overflow: auto;
  border-radius: var(--radius);
  background: #171e25;
  font: 14px/1.55 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.viewer-nav {
  position: absolute;
  top: 50%;
  display: grid;
  place-items: center;
  width: 44px;
  height: 64px;
  margin-top: -32px;
  border: 0;
  border-radius: var(--radius);
  background: rgba(14, 19, 24, 0.6);
  color: #e7ebee;
  cursor: pointer;
}
.viewer-nav:hover {
  background: rgba(255, 255, 255, 0.16);
}
.viewer-prev {
  left: 8px;
}
.viewer-next {
  right: 8px;
}
.hidden-frame {
  position: absolute;
  width: 0;
  height: 0;
  border: 0;
  visibility: hidden;
}

@media (max-width: 680px) {
  .gate {
    margin-left: 16px;
    padding-top: 9vh;
  }
  .shell {
    padding: 0 16px 96px;
  }
  .row {
    grid-template-columns: minmax(0, 1fr) auto 76px;
  }
  .row-date {
    display: none;
  }
  .tools {
    width: 100%;
    flex-wrap: nowrap;
    gap: 6px;
  }
  .tools .btn {
    flex: 1 1 auto;
    padding: 0 8px;
    font-size: 14px;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}
